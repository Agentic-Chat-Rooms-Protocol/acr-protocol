name: CI - acr-protocol

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install jsonschema
      - name: Validate protocol schemas, RFCs, and specification invariants
        run: python tests/validate_protocol.py
